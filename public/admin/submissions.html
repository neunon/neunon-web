<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://neunon-form-api.keisakamoto.workers.dev; img-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <title>フォーム送信履歴｜Neunon Consulting</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/admin/submissions.css">
  <script src="/admin/submissions.js" defer></script>
</head>
<body>
  <header class="topbar"><a href="/admin/">← コンテンツ管理</a><span>Neunon 管理サイト</span></header>
  <main>
    <div class="heading"><div><p class="eyebrow">FORM INBOX</p><h1>お問い合わせ・エントリー</h1><p>フォームから届いた内容を確認できます。添付は管理者のみダウンロードできます。</p></div><button id="logout" hidden>ログアウト</button></div>
    <section id="gate" class="gate"><h2>管理者ログイン</h2><p>閲覧にはGitHubの編集権限が必要です。送信内容はログイン後にのみ表示されます。</p><button id="login">GitHubでログイン</button></section>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="inbox" hidden>
      <div class="controls"><label>種類 <select id="type"><option value="all">すべて</option><option value="contact">企業お問い合わせ</option><option value="entry">学生エントリー</option></select></label><label>検索 <input id="search" type="search" placeholder="お名前・会社名・メール"></label><button id="reload">更新</button></div>
      <div class="columns"><div><h2>受信一覧</h2><div id="list" class="list"></div><button id="more" hidden>さらに読み込む</button></div><article id="detail" class="detail"><h2>内容</h2><p>左の一覧から選択してください。</p></article></div>
    </section>
  </main>
</body>
</html>
