name: Sync talent panel

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-talent-panel
  cancel-in-progress: false

env:
  MS_GRAPH_TENANT_ID: a2662d08-1b8c-4861-a23e-e01206549b51
  MS_GRAPH_CLIENT_ID: 44a97176-fb24-4011-b8cd-49a532d50376
  MS_GRAPH_SITE_ID: neunon.sharepoint.com,0783ad67-da83-4b5e-b7db-d1d91cb93d9b,e328c632-77ee-4a26-8a69-394bd5813640
  MS_GRAPH_TALENT_LIST_ID: d8f55970-239c-489f-ae3f-f60dcfc1dbc9

jobs:
  detect-changes:
    name: Detect Microsoft Lists changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Read the student master and compare its fingerprint
        env:
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MS_GRAPH_CLIENT_SECRET"

          access_token="$({
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=$MS_GRAPH_CLIENT_ID" \
              --data-urlencode "client_secret=$MS_GRAPH_CLIENT_SECRET" \
              --data-urlencode "scope=https://graph.microsoft.com/.default" \
              --data-urlencode "grant_type=client_credentials" \
              "https://login.microsoftonline.com/$MS_GRAPH_TENANT_ID/oauth2/v2.0/token"
          } | jq --raw-output '.access_token')"
          test -n "$access_token"
          test "$access_token" != "null"

          graph_roles="$(
            printf '%s' "$access_token" \
              | python3 -c 'import base64,json,sys; part=sys.stdin.read().split(".")[1]; part += "=" * (-len(part) % 4); print(", ".join(json.loads(base64.urlsafe_b64decode(part))["roles"]) if "roles" in json.loads(base64.urlsafe_b64decode(part)) else "none")'
          )"
          echo "Microsoft Graph application roles: $graph_roles"
          printf '### Microsoft Graph application roles\n\n`%s`\n' "${graph_roles:-none}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$graph_roles" != *"Lists.SelectedOperations.Selected"* ]]; then
            echo "::error::The app token does not contain Lists.SelectedOperations.Selected. Grant tenant admin consent and wait for permission propagation."
            exit 1
          fi

          MS_GRAPH_ACCESS_TOKEN="$access_token" node scripts/assign-talent-numbers.mjs

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $access_token" \
              --get \
              --data-urlencode '$expand=fields' \
              --data-urlencode '$top=999' \
              "https://graph.microsoft.com/v1.0/sites/$MS_GRAPH_SITE_ID/lists/$MS_GRAPH_TALENT_LIST_ID/items"
          )"

          if [[ "$http_code" != 2* ]]; then
            graph_error_code="$(jq --raw-output '.error.code // "unknown"' "$response_file" 2>/dev/null || printf 'unknown')"
            graph_error_message="$(jq --raw-output '.error.message // "No error message returned"' "$response_file" 2>/dev/null || printf 'No error message returned')"
            echo "::error::Microsoft Graph returned HTTP $http_code ($graph_error_code): $graph_error_message"
            exit 1
          fi

          list_payload="$(<"$response_file")"

          fingerprint="$({
            printf '%s' "$list_payload" \
              | jq --compact-output --sort-keys '[.value[] | {id, fields}] | sort_by(.id)' \
              | sha256sum \
              | awk '{print $1}'
          })"
          state_file=".github/talent-sync-state"
          previous_fingerprint="$(tr -d '[:space:]' < "$state_file" 2>/dev/null || true)"

          if [[ "$fingerprint" == "$previous_fingerprint" ]]; then
            echo "Student master is unchanged."
            exit 0
          fi

          printf '%s\n' "$fingerprint" > "$state_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$state_file"
          git commit -m "Sync talent panel data"
          git push origin HEAD:main
